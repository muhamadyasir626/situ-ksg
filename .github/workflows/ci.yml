name: CI/CD Laravel

on:
    push:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: deploy-production
    cancel-in-progress: false

jobs:
    deploy:
        name: Deploy to Production
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        runs-on: self-hosted

        steps:
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: /www/wwwroot/siasat.ksdae.menlhk.go.id/package-lock.json

            - name: Deploy SATSLNs
              run: |
                  set -Eeuo pipefail

                  PROJECT_DIR=/www/wwwroot/siasat.ksdae.menlhk.go.id
                  cd "$PROJECT_DIR"

                  git config --global --add safe.directory "$PROJECT_DIR"

                  php artisan down --render="errors::503" --retry=30 || true
  
                  git fetch origin main
                  git reset --hard origin/main

                  composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

                  npm ci
                  npm run build

                  php artisan migrate --force

                  php artisan storage:link || true

                  php artisan optimize:clear
                  php artisan optimize

                  php artisan queue:restart

                  php artisan up

            - name: Ensure site is up
              if: always()
              run: |
                  cd /www/wwwroot/siasat.ksdae.menlhk.go.id
                  php artisan up || true
