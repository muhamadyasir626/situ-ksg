name: Deploy SITU-KSG Production

on:
    push:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: deploy-production
    cancel-in-progress: false

jobs:
    deploy:
        name: Deploy to Production
        runs-on: self-hosted
        env:
            PROJECT_DIR: /www/wwwroot/situ-ksg

        steps:
            - name: Setup Node.js for asset build
              uses: actions/setup-node@v6
              with:
                  node-version: "22"
                  package-manager-cache: false

            - name: Validate production runner
              env:
                  COMPOSER_HOME: ${{ runner.temp }}/composer
              run: |
                  set -Eeuo pipefail
                  command -v php
                  command -v composer
                  command -v git
                  command -v node
                  command -v npm
                  mkdir -p "$COMPOSER_HOME"
                  composer --version --no-interaction
                  php -r 'if (PHP_VERSION_ID < 80401) { fwrite(STDERR, "PHP 8.4.1 or newer is required by composer.lock.\n"); exit(1); }'

            - name: Deploy SITU-KSG
              env:
                  COMPOSER_HOME: ${{ runner.temp }}/composer
              run: |
                  set -Eeuo pipefail

                  cd "$PROJECT_DIR"

                  export GIT_CONFIG_COUNT=1
                  export GIT_CONFIG_KEY_0=safe.directory
                  export GIT_CONFIG_VALUE_0="$PROJECT_DIR"

                  php artisan down --render="errors::503" --retry=30 || true

                  git fetch origin main
                  git reset --hard origin/main

                  composer check-platform-reqs --lock --no-dev

                  composer install \
                      --no-dev \
                      --no-interaction \
                      --prefer-dist \
                      --optimize-autoloader \
                      --classmap-authoritative \
                      --no-progress
                  composer check-platform-reqs --no-dev

                  npm ci --include=dev --no-audit --no-fund
                  npm run build
                  rm -rf node_modules

                  php artisan migrate --force

                  php artisan storage:link || true

                  php artisan optimize:clear
                  php artisan config:cache
                  php artisan event:cache
                  php artisan route:cache
                  php artisan view:cache

                  php artisan queue:restart

                  php artisan up

            - name: Ensure site is up
              if: always()
              run: |
                  set -Eeuo pipefail
                  cd "$PROJECT_DIR"
                  php artisan up || true
